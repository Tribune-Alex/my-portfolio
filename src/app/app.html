
<header class="navbar">
  <a class="logo" routerLink="/">Portfolio<span>.</span></a>

  
<button
  class="menu-toggle"
  type="button"
  [attr.aria-expanded]="menuOpen()"
  aria-label="Toggle navigation menu"
  (click)="toggleMenu()"
>
  <span>{{ menuOpen() ? '✕' : '☰' }}</span>
</button>

<nav [class.menu-open]="menuOpen()">
  <a routerLink="/" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }"
     ariaCurrentWhenActive="page" (click)="closeMenu()">
    {{ 'NAV.HOME' | translate }}
  </a>

  <a routerLink="/about" routerLinkActive="active"
     ariaCurrentWhenActive="page" (click)="closeMenu()">
    {{ 'NAV.ABOUT' | translate }}
  </a>

  <a routerLink="/skills" routerLinkActive="active"
     ariaCurrentWhenActive="page" (click)="closeMenu()">
    {{ 'NAV.SKILLS' | translate }}
  </a>

  <a routerLink="/projects" routerLinkActive="active"
     ariaCurrentWhenActive="page" (click)="closeMenu()">
    {{ 'NAV.PROJECTS' | translate }}
  </a>

  <a routerLink="/contact" routerLinkActive="active"
     ariaCurrentWhenActive="page" (click)="closeMenu()">
    {{ 'NAV.CONTACT' | translate }}
  </a>
</nav>


  <div class="language-switcher" aria-label="Choose language">
    <button type="button" [class.active]="currentLanguage() === 'en'" (click)="changeLanguage('en')">EN</button>
    <button type="button" [class.active]="currentLanguage() === 'ka'" (click)="changeLanguage('ka')">KA</button>
    <button type="button" [class.active]="currentLanguage() === 'ru'" (click)="changeLanguage('ru')">RU</button>
  </div>
</header>

<router-outlet />
